# Firebase App Hosting config for Renni Command Center.
# Run the Nuxt server on GCP so /api/auth/provision + Admin SDK use ADC
# from the App Hosting service account (no service-account key needed,
# which is important because the org policy iam.disableServiceAccountKeyCreation
# is enforced on this project).

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512
  concurrency: 80

# NUXT_PUBLIC_* values are safe to embed in the client bundle (not secrets).
# They must be present at BUILD time so Nuxt inlines them into /_nuxt assets.
# Fill each `value` with the corresponding string from your local .env before
# deploying. FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY are NOT set here —
# the server falls back to Application Default Credentials at runtime, which
# App Hosting provides automatically via its service account.
env:
  - variable: NUXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyA-MkxGN-4eZVJ8eezk6hPrW96cOi--XoU
    availability:
      - BUILD
      - RUNTIME
  - variable: NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: renni-command-center.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NUXT_PUBLIC_FIREBASE_PROJECT_ID
    value: renni-command-center
    availability:
      - BUILD
      - RUNTIME
  - variable: NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: renni-command-center.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "335815229018"
    availability:
      - BUILD
      - RUNTIME
  - variable: NUXT_PUBLIC_FIREBASE_APP_ID
    value: 1:335815229018:web:04c7aeb61281dc3b232263
    availability:
      - BUILD
      - RUNTIME
  - variable: NUXT_EXECUTIVE_ADVISOR_ENABLED
    value: "true"
    availability:
      - RUNTIME
  # projectId fallback the server admin util reads when NUXT_PUBLIC_* isn't
  # available (e.g. on direct tsx invocations). Safe to set to the same
  # non-secret project id.
  - variable: FIREBASE_PROJECT_ID
    value: renni-command-center
    availability:
      - RUNTIME

  # AI Critique V1 — Anthropic Messages API. The key is stored as a
  # Secret Manager secret named NUXT_AI_CRITIQUE_API_KEY and only
  # exposed to the running server (no BUILD availability, no public
  # bundle exposure). BASE_URL and MODEL are non-secret tunables.
  - variable: NUXT_AI_CRITIQUE_API_KEY
    secret: NUXT_AI_CRITIQUE_API_KEY
    availability:
      - RUNTIME
  - variable: NUXT_AI_CRITIQUE_BASE_URL
    value: https://api.anthropic.com
    availability:
      - RUNTIME
  - variable: NUXT_AI_CRITIQUE_MODEL
    value: claude-haiku-4-5-20251001
    availability:
      - RUNTIME

  # Customer Profile Builder beta flag. Read at BUILD time by
  # nuxt.config.ts (process.env.NUXT_CUSTOMER_PROFILE_BUILDER_ENABLED)
  # and inlined into runtimeConfig.public.customerProfileBuilderEnabled.
  # When `"true"`, the beta panel appears below the existing chip-pick
  # QuickStart on the BMC customer-segments section. The existing
  # ChipPickQuickStart is unaffected. RUNTIME availability is harmless
  # future-proofing. To DISABLE: change the value to `"false"` (or
  # remove this block) and redeploy.
  - variable: NUXT_CUSTOMER_PROFILE_BUILDER_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
